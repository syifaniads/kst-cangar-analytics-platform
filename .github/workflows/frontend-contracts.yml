name: Validate frontend API contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run API helper contract tests
        run: node --test tests/api-request.test.mjs
